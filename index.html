<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- ИЗМЕНИТЬ: заголовок вкладки браузера -->
<title>Премия «Лучший клинер» — Голосование</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background: #0f1a1c;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 12px),
      radial-gradient(ellipse at 20% 10%, rgba(0, 120, 100, 0.18) 0%, transparent 50%),
      radial-gradient(ellipse at 85% 90%, rgba(180, 140, 40, 0.15) 0%, transparent 55%);
    min-height: 100vh;
    color: #e8e6df;
    padding: 14px;
    position: relative;
    overflow-x: hidden;
  }

  /* Тонкая текстура-сетка поверх фона */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events: none;
    z-index: -1;
  }

  /* Декоративные линии по диагонали */
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(120deg, transparent 40%, rgba(201, 161, 74, 0.05) 50%, transparent 60%),
      linear-gradient(60deg,  transparent 40%, rgba(0, 150, 120, 0.06) 50%, transparent 60%);
    pointer-events: none;
    z-index: -1;
  }

  /* Флаг России сбоку — аккуратнее */
  .flag {
    position: fixed;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    width: 20px;
    height: 60px;
    border-radius: 0 4px 4px 0;
    overflow: hidden;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
    opacity: 0.85;
    z-index: 100;
  }
  .flag div { flex: 1; }
  .flag .white { background: #f8f8f8; }
  .flag .blue  { background: #3a5a9c; }
  .flag .red   { background: #b8322a; }

  /* Шапка */
  header {
    text-align: center;
    padding: 26px 14px 18px;
    max-width: 880px;
    margin: 0 auto;
    position: relative;
  }
  header .eyebrow {
    display: inline-block;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #c9a14a;
    font-weight: 600;
    margin-bottom: 12px;
    padding: 6px 14px;
    border: 1px solid rgba(201, 161, 74, 0.4);
    border-radius: 30px;
  }
  header h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.45rem, 4.8vw, 2.4rem);
    font-weight: 700;
    color: #f1efe8;
    letter-spacing: 0.3px;
    line-height: 1.18;
  }
  header h1 em {
    font-style: italic;
    color: #d4b25e;
  }
  header h1::after {
    content: "✦ ✦ ✦";
    display: block;
    font-size: 0.7rem;
    letter-spacing: 8px;
    color: #c9a14a;
    margin: 14px auto 0;
    opacity: 0.7;
  }
  header p {
    margin-top: 14px;
    font-size: clamp(0.85rem, 2.8vw, 1rem);
    color: #a8b0ac;
    line-height: 1.5;
    max-width: 480px;
    margin-left: auto;
    margin-right: auto;
  }

  /* Контейнер карточек */
  .cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
    max-width: 880px;
    margin: 0 auto;
    padding: 4px;
  }
  @media (min-width: 640px) {
    .cards { grid-template-columns: 1fr 1fr; gap: 28px; }
  }

  .card {
    background: linear-gradient(180deg, #1c2a2c 0%, #162022 100%);
    border-radius: 22px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
    display: flex;
    flex-direction: column;
    position: relative;
    border: 1px solid rgba(201, 161, 74, 0.15);
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.55), 0 0 0 1px rgba(201, 161, 74, 0.35);
    border-color: rgba(201, 161, 74, 0.4);
  }

  /* Уникальная деталь: золотая засечка на углу карточки */
  .card::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, rgba(201, 161, 74, 0.35) 0%, transparent 60%);
    border-radius: 22px 0 0 0;
    pointer-events: none;
  }

  .photo {
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    display: block;
    background: #1f2a2c;
    filter: saturate(1.05) contrast(1.02);
  }
  @media (min-width: 640px) {
    .photo { aspect-ratio: 4 / 5; }
  }

  .card-body {
    padding: 16px 16px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    flex-grow: 1;
    position: relative;
    z-index: 1;
  }

  .name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.05rem, 3.7vw, 1.3rem);
    font-weight: 600;
    text-align: center;
    color: #f1efe8;
    line-height: 1.25;
    letter-spacing: 0.2px;
  }
  .name::after {
    content: "";
    display: block;
    width: 26px;
    height: 2px;
    margin: 8px auto 0;
    background: #c9a14a;
    border-radius: 2px;
    opacity: 0.7;
  }

  /* Кнопка — золотой градиент */
  .btn-vote {
    display: inline-block;
    width: 100%;
    padding: 14px 18px;
    background: linear-gradient(135deg, #c9a14a 0%, #e0c06a 50%, #b8912f 100%);
    color: #162022;
    text-decoration: none;
    font-family: 'Manrope', sans-serif;
    font-size: clamp(0.95rem, 3.2vw, 1.05rem);
    font-weight: 800;
    letter-spacing: 0.4px;
    text-align: center;
    border-radius: 14px;
    border: none;
    cursor: pointer;
    transition: filter 0.2s ease, transform 0.1s ease, box-shadow 0.2s ease;
    box-shadow: 0 4px 14px rgba(201, 161, 74, 0.25);
    -webkit-tap-highlight-color: transparent;
  }
  .btn-vote:hover { filter: brightness(1.08); box-shadow: 0 6px 20px rgba(201, 161, 74, 0.4); }
  .btn-vote:active { transform: scale(0.97); }

  footer {
    text-align: center;
    padding: 30px 14px 20px;
    color: #6b7772;
    font-size: 0.8rem;
    letter-spacing: 0.3px;
  }
  footer span {
    display: inline-block;
    margin: 0 6px;
    color: #c9a14a;
    opacity: 0.6;
  }
</style>
</head>
<body>

  <div class="flag" aria-label="Флаг России">
    <div class="white"></div>
    <div class="blue"></div>
    <div class="red"></div>
  </div>

  <header>
    <div class="eyebrow">Премия зрительских симпатий</div>
    <!-- ИЗМЕНИТЬ: главный заголовок -->
    <h1>Лучший <em>клинер</em> на коне</h1>
    <!-- ИЗМЕНИТЬ: подзаголовок -->
    <p>Каждый голос важен. Выберите участницу, которая, по вашему мнению, достойна звания лучшей в этом сезоне.</p>
  </header>

  <main class="cards">

    <!-- КАРТОЧКА 1 -->
    <div class="card">
      <img class="photo" src="https://i.ibb.co/5g072Ch3/biba.webp?text=Фото+1" alt="Фото 1">
      <div class="card-body">
        <div class="name">Чуина Лариса</div>
        <a class="btn-vote" href="https://jorneybeastmoy.click/0loz3xpv3lcmz9sus977" target="_blank" rel="noopener">Отдать голос</a>
      </div>
    </div>

    <!-- КАРТОЧКА 2 -->
    <div class="card">
      <img class="photo" src="https://i.ibb.co/93sxyswf/2.webp?text=Фото+2" alt="Фото 2">
      <div class="card-body">
        <div class="name">Сидорова Анна</div>
        <a class="btn-vote" href="https://jorneybeastmoy.click/0loz3xpv3lcmz9sus977" target="_blank" rel="noopener">Отдать голос</a>
      </div>
    </div>

  </main>

  <footer>
    Голосование — 2026 <span>✦</span> Все права защищены
  </footer>

</body>
</html>
